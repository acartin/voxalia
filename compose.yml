name: voxalia

x-chatwoot-env: &chatwoot-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:8300}
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?set CHATWOOT_SECRET_KEY_BASE in .env}
  REDIS_URL: redis://redis:6379
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DATABASE: ${CHATWOOT_DB:-chatwoot}
  POSTGRES_USERNAME: ${CHATWOOT_DB_USER:-chatwoot_app}
  POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:?set CHATWOOT_DB_PASSWORD in .env}
  ACTIVE_STORAGE_SERVICE: local
  FORCE_SSL: "false"
  ENABLE_ACCOUNT_SIGNUP: "true"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: voxalia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_BOOTSTRAP_DB:-chatwoot}
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-voxalia}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?set POSTGRES_BOOTSTRAP_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-8432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BOOTSTRAP_USER:-voxalia} -d ${POSTGRES_BOOTSTRAP_DB:-chatwoot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - voxalia-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: voxalia-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - voxalia-redis-data:/data
    restart: unless-stopped

  chatwoot:
    image: chatwoot/chatwoot:latest-ce
    container_name: voxalia-chatwoot
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment:
      <<: *chatwoot-env
    ports:
      - "${CHATWOOT_PORT:-8300}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - voxalia-chatwoot-storage:/app/storage
    restart: unless-stopped

  chatwoot-worker:
    image: chatwoot/chatwoot:latest-ce
    container_name: voxalia-chatwoot-worker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      <<: *chatwoot-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - voxalia-chatwoot-storage:/app/storage
    restart: unless-stopped

  voxalia-web:
    build:
      context: ./services/web/voxalia
    image: voxalia-web:dev
    container_name: voxalia-web
    environment:
      VOXALIA_API_BASE_URL: ${VOXALIA_API_BASE_URL:-http://voxalia-web-api:8000/api/v1}
      VOXALIA_ASTERISK_API_BASE_URL: ${VOXALIA_ASTERISK_API_BASE_URL:-http://voxalia-asterisk:8000/api/v1}
      VOXALIA_PLACEHOLDER_AUTH: ${VOXALIA_PLACEHOLDER_AUTH:-false}
      VOXALIA_SECURE_COOKIES: ${VOXALIA_SECURE_COOKIES:-false}
    ports:
      - "${VOXALIA_WEB_PORT:-8320}:3000"
    depends_on:
      voxalia-web-api:
        condition: service_started
      voxalia-asterisk:
        condition: service_started
    restart: unless-stopped

  voxalia-web-api:
    build:
      context: ./services/web-api
    image: voxalia-web-api:dev
    container_name: voxalia-web-api
    environment:
      VOXALIA_DATABASE_URL: ${VOXALIA_DATABASE_URL:?set VOXALIA_DATABASE_URL in .env}
      VOXALIA_BOOTSTRAP_ADMIN_USERNAME: ${VOXALIA_BOOTSTRAP_ADMIN_USERNAME:-}
      VOXALIA_BOOTSTRAP_ADMIN_EMAIL: ${VOXALIA_BOOTSTRAP_ADMIN_EMAIL:-}
      VOXALIA_BOOTSTRAP_ADMIN_PASSWORD: ${VOXALIA_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${VOXALIA_WEB_API_PORT:-8330}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  voxalia-asterisk:
    build:
      context: ./services/asterisk
    image: voxalia-asterisk:dev
    container_name: voxalia-asterisk
    environment:
      VOXALIA_ASTERISK_DATABASE_URL: ${VOXALIA_ASTERISK_DATABASE_URL:-${VOXALIA_DATABASE_URL:?set VOXALIA_DATABASE_URL in .env}}
    ports:
      - "${VOXALIA_ASTERISK_PORT:-8340}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  freepbx-db:
    image: mariadb:10.11
    container_name: voxalia-freepbx-db
    environment:
      TZ: ${FREEPBX_TZ:-America/Costa_Rica}
      MYSQL_ROOT_PASSWORD: ${FREEPBX_MYSQL_ROOT_PASSWORD:?set FREEPBX_MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${FREEPBX_MYSQL_USER:-freepbxuser}
      MYSQL_PASSWORD: ${FREEPBX_MYSQL_PASSWORD:?set FREEPBX_MYSQL_PASSWORD in .env}
    volumes:
      - voxalia-freepbx-db-data:/var/lib/mysql
      - ./infra/freepbx/my.cnf:/etc/mysql/my.cnf:ro
      - ./infra/freepbx/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      default:
        aliases:
          - db
    restart: unless-stopped

  freepbx:
    image: escomputers/freepbx:17-nofail2ban
    container_name: voxalia-freepbx
    environment:
      TZ: ${FREEPBX_TZ:-America/Costa_Rica}
    ports:
      - "${FREEPBX_HTTP_PORT:-8310}:80/tcp"
      - "${FREEPBX_HTTPS_PORT:-8311}:443/tcp"
      - "${FREEPBX_ASTERISK_WS_PORT:-8088}:8088/tcp"
      - "${FREEPBX_ASTERISK_WSS_PORT:-8089}:8089/tcp"
      - "${FREEPBX_SIP_PORT:-5062}:5060/udp"
      - "${FREEPBX_RTP_START:-12000}-${FREEPBX_RTP_END:-12100}:12000-12100/udp"
    depends_on:
      - freepbx-db
    volumes:
      - /usr/share/zoneinfo/${FREEPBX_TZ:-America/Costa_Rica}:/etc/localtime:ro
      - voxalia-freepbx-var:/var
      - voxalia-freepbx-etc:/etc
      - ./infra/freepbx/ensure-modules.sh:/usr/local/bin/voxalia-ensure-freepbx-modules.sh:ro
      - ./infra/freepbx/entrypoint-with-modules.sh:/usr/local/bin/voxalia-freepbx-entrypoint.sh:ro
    command: ["bash", "/usr/local/bin/voxalia-freepbx-entrypoint.sh"]
    restart: unless-stopped

  chatwoot-prepare:
    image: chatwoot/chatwoot:latest-ce
    profiles: ["setup"]
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    environment:
      <<: *chatwoot-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  voxalia-postgres-data:
  voxalia-redis-data:
  voxalia-chatwoot-storage:
  voxalia-freepbx-db-data:
  voxalia-freepbx-var:
  voxalia-freepbx-etc:

networks:
  default:
    name: voxalia-net
